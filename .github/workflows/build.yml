name: Build CloudStream Extension

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build extension
        run: gradle make makePluginsJson

      - name: Publish builds branch
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/publish
          cp FamelackIndia/build/*.cs3 /tmp/publish/
          cp build/plugins.json /tmp/publish/
          cp repo.json /tmp/publish/

          git fetch origin builds:refs/remotes/origin/builds || true

          rm -rf /tmp/builds
          if git show-ref --verify --quiet refs/remotes/origin/builds; then
            git worktree add /tmp/builds origin/builds
            cd /tmp/builds
            git checkout -B builds
            git rm -rf . || true
          else
            git worktree add --orphan -b builds /tmp/builds
            cd /tmp/builds
          fi

          cp /tmp/publish/* .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Famelack India TV"
          git push origin builds --force
