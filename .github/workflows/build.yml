name: Build CloudStream Extension

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds
          fetch-depth: 0
        continue-on-error: true

      - name: Prepare builds directory
        run: mkdir -p "$GITHUB_WORKSPACE/builds"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build extension
        working-directory: src
        run: gradle make makePluginsJson

      - name: Publish build
        run: |
          set -e
          rm -f "$GITHUB_WORKSPACE"/builds/*.cs3
          rm -f "$GITHUB_WORKSPACE"/builds/plugins.json
          cp "$GITHUB_WORKSPACE"/src/FamelackIndia/build/*.cs3 "$GITHUB_WORKSPACE"/builds/
          cp "$GITHUB_WORKSPACE"/src/build/plugins.json "$GITHUB_WORKSPACE"/builds/
          cp "$GITHUB_WORKSPACE"/src/repo.json "$GITHUB_WORKSPACE"/builds/
          cd "$GITHUB_WORKSPACE/builds"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Famelack India TV" || true
          git push origin HEAD:builds --force
